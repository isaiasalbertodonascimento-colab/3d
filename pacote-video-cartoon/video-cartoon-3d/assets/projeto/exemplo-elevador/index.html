function strokes(g,w,h,n,cols,len=60,wd=10,a=.08){for(let i=0;i<n;i++){g.strokeStyle=cols[i%cols.length];g.globalAlpha=a*(.5+R());g.lineWidth=wd*(.5+R());g.lineCap='round';const x=R()*w,y=R()*h,an=(R()-.5)*.8;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(an)*len*.5,y+Math.sin(an)*len*.5+(R()-.5)*10,x+Math.cos(an)*len,y+Math.sin(an)*len);g.stroke();}g.globalAlpha=1;}

const box=(w,h,d,mat,par,x,y,z)=>M(new THREE.BoxGeometry(w,h,d),mat,par,x,y,z);
const cyl=(rt,rb,h,mat,par,x,y,z,seg=20)=>M(new THREE.CylinderGeometry(rt,rb,h,seg),mat,par,x,y,z);
const soft=ctex(256,256,g=>{const r=g.createRadialGradient(128,128,0,128,128,128);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.3,'rgba(255,255,255,.5)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,256,256);});


// 1-4 parede de reboco pintado, lambri de madeira, rodapé, moldura no teto
const plaster=ctex(1024,1024,(g,w,h)=>{g.fillStyle='#8f8597';g.fillRect(0,0,w,h);strokes(g,w,h,900,['#9d93a6','#80778b','#a59cad','#7a7186'],120,26,.12);grainy(g,w,h,12);for(let i=0;i<6;i++){g.strokeStyle='rgba(60,50,70,.25)';g.lineWidth=2;let x=R()*w,y=R()*h;g.beginPath();g.moveTo(x,y);for(let k=0;k<8;k++){x+=(R()-.5)*50;y+=R()*40;g.lineTo(x,y);}g.stroke();}},[2,1]);
const woodT=(base,rep)=>ctex(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<220;i++){g.strokeStyle=`rgba(${R()>.5?'40,22,12':'150,100,60'},${.08+R()*.12})`;g.lineWidth=1+R()*3;const y=R()*h;g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w*.3,y+(R()-.5)*14,w*.6,y+(R()-.5)*14,w,y+(R()-.5)*8);g.stroke();}grainy(g,w,h,16);},rep);
const wallM=std({map:plaster,roughness:.95,color:'#c9bfd2'});

const W=6,D=6,H=3.3;
const wall=(w,h,x,y,z,ry)=>{const m=M(new THREE.PlaneGeometry(w,h),wallM,ROOM,x,y,z,false);m.rotation.y=ry;return m;};
// parede do fundo com vão da janela (x .25..2.05, y .95..2.75)
box(3.25,H,.2,wallM,ROOM,-1.375,H/2,-3.1);box(.95,H,.2,wallM,ROOM,2.525,H/2,-3.1);box(1.8,.95,.2,wallM,ROOM,1.15,.475,-3.1);box(1.8,.55,.2,wallM,ROOM,1.15,3.025,-3.1);

const outside=ctex(1024,1024,(g,w,h)=>{const sk=g.createLinearGradient(0,0,0,h);sk.addColorStop(0,'#f6c98a');sk.addColorStop(.45,'#f9dfb4');sk.addColorStop(1,'#cfd6c2');g.fillStyle=sk;g.fillRect(0,0,w,h);
  const hill=(y,col,amp,n)=>{g.fillStyle=col;g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=8)g.lineTo(x,y+Math.sin(x/w*Math.PI*n+y)*amp+Math.sin(x*.05)*amp*.2);g.lineTo(w,h);g.fill();};
  hill(520,'#b9b7a5',40,2);hill(600,'#8e9a80',50,3);for(let i=0;i<70;i++){const x=R()*w,y=640+R()*120;g.fillStyle=['#5f7a55','#6c8a5e','#506b48'][i%3];g.beginPath();g.moveTo(x,y-60-R()*40);g.lineTo(x+18,y);g.lineTo(x-18,y);g.fill();}
  hill(760,'#4f6b46',30,5);for(let i=0;i<10;i++){g.fillStyle='rgba(255,240,220,.25)';g.fillRect(0,480+i*30,w,14);}});
const outM=new THREE.MeshBasicMaterial({map:outside,toneMapped:false,fog:false});M(new THREE.PlaneGeometry(3.6,3),outM,ROOM,1.15,1.8,-3.9,false);
const glassM=new THREE.MeshStandardMaterial({map:lattice,transparent:true,opacity:.42,roughness:.15,metalness:.1,emissive:'#ffdcae',emissiveIntensity:.35,emissiveMap:lattice});
M(new THREE.PlaneGeometry(1.8,1.8),glassM,ROOM,1.15,1.85,-3.05,false);
const stone=std({color:'#8c8492',map:plaster,roughness:.95});
box(2.05,.12,.42,stone,ROOM,1.15,.92,-2.88);box(.14,1.95,.3,stone,ROOM,.18,1.85,-3.02);box(.14,1.95,.3,stone,ROOM,2.12,1.85,-3.02);box(2.05,.16,.3,stone,ROOM,1.15,2.83,-3.02);
box(.07,1.8,.08,darkWood,ROOM,1.15,1.85,-3.0);box(1.8,.07,.08,darkWood,ROOM,1.15,1.85,-3.0);
// 13-16 cortinas de veludo roxo com dobras, varão com ponteiras, prendedor dourado
const velvet=ctex(256,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,0);for(let i=0;i<=8;i++)gr.addColorStop(i/8,i%2?'#4a2a5e':'#62387a');g.fillStyle=gr;g.fillRect(0,0,w,h);grainy(g,w,h,10);});
const CURT=[];for(const[x,s]of[[.05,-1],[2.25,1]]){const geo=new THREE.PlaneGeometry(.7,2.75,16,24);const p=geo.attributes.position;for(let i=0;i<p.count;i++){const px=p.getX(i),py=p.getY(i),k=(1.375-py)/2.75;const tie=Math.exp(-Math.pow((py+.25)/.35,2));p.setX(i,px*(1-tie*.55)+s*tie*.08);p.setZ(i,Math.sin(px*28)*.05*(1-tie*.6)+.03);}geo.computeVertexNormals();const m=M(geo,std({map:velvet,side:THREE.DoubleSide,roughness:.85}),ROOM,x,1.62,-2.86);CURT.push(m);
  const tb=M(new THREE.TorusGeometry(.12,.025,8,20),std({color:'#c9a24a',metalness:.8,roughness:.3}),ROOM,x+s*.02,1.37,-2.84);tb.rotation.x=Math.PI/2;}
cyl(.022,.022,2.7,std({color:'#2a2022',metalness:.6,roughness:.4}),ROOM,1.15,3.0,-2.86).rotation.z=Math.PI/2;
for(const x of[-.2,2.5])M(new THREE.SphereGeometry(.05,12,8),std({color:'#c9a24a',metalness:.8,roughness:.3}),ROOM,x,3.0,-2.86);
// 17-20 luz do pôr do sol projetando o quadriculado da janela no chão e na cama
const sun=new THREE.SpotLight('#ffbf7a',220,30,.42,.55,1.3);sun.position.set(2.2,5.2,-8.5);sun.target.position.set(-.6,0,-.6);sun.map=lattice;sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;sun.shadow.radius=3;ROOM.add(sun,sun.target);
const hemi=new THREE.HemisphereLight('#9f8fc8','#5a3a2a',1.05);ROOM.add(hemi);
const fillL=new THREE.PointLight('#9c7cd6',6,12,1.6);fillL.position.set(-1.5,2.6,2.2);ROOM.add(fillL);
// 21-24 feixes de luz (raios) e poeira dourada flutuando
const rayTex=ctex(64,512,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,214,150,.9)');gr.addColorStop(1,'rgba(255,214,150,0)');g.fillStyle=gr;g.fillRect(0,0,w,h);const gx=g.createLinearGradient(0,0,w,0);gx.addColorStop(0,'rgba(0,0,0,1)');gx.addColorStop(.5,'rgba(0,0,0,0)');gx.addColorStop(1,'rgba(0,0,0,1)');g.globalCompositeOperation='destination-out';g.fillStyle=gx;g.fillRect(0,0,w,h);});
const RAYS=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.35+R()*.35,4.2),new THREE.MeshBasicMaterial({map:rayTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:.1+R()*.07,side:THREE.DoubleSide,fog:false}));m.geometry.translate(0,-2.1,0);m.position.set(.4+i*.25,2.6,-2.9);m.rotation.set(-.62,.25,-.12+i*.03);ROOM.add(m);RAYS.push(m);}
const DUST=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.BufferAttribute(new Float32Array(400*3),3)),new THREE.PointsMaterial({color:'#ffe2b0',size:3,sizeAttenuation:false,transparent:true,opacity:.8,depthWrite:false}));ROOM.add(DUST);

// ---------- plantas ----------
const leafTex=ctex(128,256,(g,w,h)=>{g.fillStyle='#fff';g.beginPath();g.moveTo(64,0);g.bezierCurveTo(128,60,118,190,64,256);g.bezierCurveTo(10,190,0,60,64,0);g.fill();g.globalCompositeOperation='source-atop';const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'#d8f0c0');gr.addColorStop(.5,'#ffffff');gr.addColorStop(1,'#c0dca8');g.fillStyle=gr;g.fillRect(0,0,w,h);g.strokeStyle='rgba(60,100,40,.55)';g.lineWidth=4;g.beginPath();g.moveTo(64,10);g.lineTo(64,250);g.stroke();for(let i=0;i<7;i++){g.lineWidth=2;g.beginPath();g.moveTo(64,40+i*28);g.lineTo(20,20+i*28);g.moveTo(64,40+i*28);g.lineTo(108,20+i*28);g.stroke();}});

function leafAt(par,pos,dir,up,len,wid,col){const geo=new THREE.PlaneGeometry(wid,len);geo.translate(0,len/2,0);const m=new THREE.Mesh(geo,leafM.clone());m.material.color.set(col);m.position.copy(pos);const q=new THREE.Quaternion().setFromUnitVectors(V(0,1,0),dir.clone().normalize());m.quaternion.copy(q);m.rotateY(up);m.castShadow=true;m.receiveShadow=true;par.add(m);return m;}
// 25-34 samambaia grande (frondes arqueadas com folíolos)
function fern(x,z,s=1){const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);ROOM.add(g);
  cyl(.28,.22,.5,std({color:'#a65a3a',roughness:.8}),g,0,.25,0,24);M(new THREE.TorusGeometry(.28,.04,8,24),std({color:'#b8683f'}),g,0,.5,0).rotation.x=Math.PI/2;cyl(.26,.26,.04,std({color:'#3a2a1f'}),g,0,.49,0);
  for(let f2=0;f2<16;f2++){const a=f2/16*TAU+R()*.3,L=.9+R()*.5,pts=[];for(let k=0;k<=10;k++){const u=k/10;pts.push(V(Math.cos(a)*u*L*.9,.5+Math.sin(u*Math.PI*.75)*L*.75-u*u*L*.25,Math.sin(a)*u*L*.9));}
    const cv=new THREE.CatmullRomCurve3(pts);M(new THREE.TubeGeometry(cv,16,.008,5),std({color:'#4f7a2e'}),g);const fr={g:new THREE.Group(),a};g.add(fr.g);
    for(let k=1;k<26;k++){const u=k/26,p=cv.getPoint(u),tg=cv.getTangent(u),sd=V(-Math.sin(a),0,Math.cos(a)),sz=(1-u)*.9+.15;for(const sg of[-1,1]){const d=sd.clone().multiplyScalar(sg).add(tg.clone().multiplyScalar(.6)).add(V(0,-.25,0));leafAt(fr.g,p,d,0,.16*sz,.05*sz,['#6fae3e','#5f9e36','#7cbc48'][k%3]);}}
    PLANTS.push(fr);}}
fern(-2.55,-2.72,1.0);
// 35-40 girassol alto no vaso de barro
const SUNF=new THREE.Group();SUNF.position.set(2.55,0,-2.45);ROOM.add(SUNF);
{cyl(.25,.19,.45,std({color:'#b4643c'}),SUNF,0,.225,0);M(new THREE.TorusGeometry(.25,.035,8,24),std({color:'#c27245'}),SUNF,0,.45,0).rotation.x=Math.PI/2;
 const cv=new THREE.CatmullRomCurve3([V(0,.45,0),V(.05,1.0,0),V(-.04,1.6,.02),V(.06,2.15,.05)]);M(new THREE.TubeGeometry(cv,20,.025,8),std({color:'#5b8f34'}),SUNF);
 for(let i=0;i<7;i++){const u=.15+i*.11,p=cv.getPoint(u),a=i*2.3;leafAt(SUNF,p,V(Math.cos(a),.5,Math.sin(a)),0,.34-i*.02,.22-i*.012,'#5f9e36');}
 const head=new THREE.Group();head.position.copy(cv.getPoint(1));head.rotation.set(.3,-.6,0);SUNF.add(head);SUNF.userData.head=head;
 const seeds=ctex(256,256,g=>{g.fillStyle='#4a2c16';g.fillRect(0,0,256,256);for(let i=0;i<500;i++){const a=i*2.39996,r=Math.sqrt(i)*5.5;g.fillStyle=i%2?'#6a4020':'#2e1a0c';g.beginPath();g.arc(128+Math.cos(a)*r,128+Math.sin(a)*r,3,0,7);g.fill();}});
 const disk=M(new THREE.CircleGeometry(.17,32),std({map:seeds,roughness:.9}),head,0,0,.02);
 const petalT=ctex(64,192,g=>{g.fillStyle='#fff';g.beginPath();g.ellipse(32,96,26,92,0,0,7);g.fill();});
 for(let i=0;i<28;i++){const a=i/28*TAU,m=new THREE.Mesh(new THREE.PlaneGeometry(.07,.2),new THREE.MeshStandardMaterial({map:petalT,alphaTest:.5,side:THREE.DoubleSide,color:i%2?'#f7c531':'#f2b21f'}));m.geometry.translate(0,.1,0);m.position.set(Math.cos(a)*.15,Math.sin(a)*.15,i%2?.01:0);m.rotation.z=a-Math.PI/2;m.rotation.x=i%2?.15:.3;m.castShadow=true;head.add(m);}}
// 41-46 mudinhas no parapeito em potinhos brancos
for(let i=0;i<4;i++){const g=new THREE.Group();g.position.set(.5+i*.42,.98,-2.85);ROOM.add(g);cyl(.07,.055,.13,std({color:'#f1ece3',roughness:.5}),g,0,.065,0);cyl(.065,.065,.01,std({color:'#3a2a1f'}),g,0,.125,0);

function zig(x1,y1,x2,y2,seed,jag=.16,n=9){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,px=-dy/L,py=dx/L,pts=[[x1,y1]];

const pd=pts=>'M'+pts.map(p=>f(p[0])+' '+f(p[1])).join(' L');
function strokeArc(d,w,op=1,glow='#6fc8ff'){return `<path d="${d}" stroke="${glow}" stroke-width="${f(w*4.5)}" opacity="${f(.22*op)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="#bfe6ff" stroke-width="${f(w*1.9)}" opacity="${f(.65*op)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="#ffffff" stroke-width="${f(w*.75)}" opacity="${f(op)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;}
function zap(x1,y1,x2,y2,seed,o={}){const w=o.w||8,pts=zig(x1,y1,x2,y2,seed,o.jag??.16,o.n||9);let h=strokeArc(pd(pts),w,o.op??1,o.glow);

    h+=strokeArc(pd(zig(p[0],p[1],p[0]+Math.cos(a)*L,p[1]+Math.sin(a)*L,seed+b*31,.25,4)),w*.5,(o.op??1)*.8,o.glow);}return h;}
function sparks(x,y,r,t,n=5,w=5,seed=0){const fr=Math.floor(t*15);let h='';for(let k=0;k<n;k++){const a=rnd(seed+k*5+fr*11)*TAU,r0=r*(.25+rnd(seed+k+fr)*.3),r1=r*(.7+rnd(seed+k*2+fr)*.4);h+=zap(x+Math.cos(a)*r0,y+Math.sin(a)*r0,x+Math.cos(a+.4)*r1,y+Math.sin(a+.4)*r1,seed+k*17+fr,{w,br:0,jag:.35,n:4});}return h;}

// raio em 3D: pontos entre A e B com deslocamento, projetados na tela
function bolt3D(A,B,seed,o={}){const n=o.n||14,L=A.distanceTo(B),d=V(0,0,0).subVectors(B,A),u1=V(0,0,0).crossVectors(d,V(0,0,1)).normalize(),u2=V(0,0,0).crossVectors(d,u1).normalize();if(u1.lengthSq()<.1)u1.set(1,0,0);
  const pts=[];for(let i=0;i<=n;i++){const k=i/n,j=(o.jag??.09)*L*Math.sin(k*Math.PI)*(i%2?1:.55);const P=V(0,0,0).lerpVectors(A,B,k).addScaledVector(u1,(rnd(seed*7+i)-.5)*2*j).addScaledVector(u2,(rnd(seed*5+i+40)-.5)*2*j);const q=proj(P);if(q.z>1)return'';pts.push([q.x,q.y]);}
  let h=strokeArc(pd(pts),o.w||10,o.op??1,o.glow);
  for(let b=0;b<(o.br??3);b++){const j=2+Math.floor(rnd(seed+b*9)*(n-4)),p=pts[j],q=pts[j+1],a=Math.atan2(q[1]-p[1],q[0]-p[0])+(rnd(seed+b*3)>.5?.7:-.7),LL=Math.hypot(pts[n][0]-pts[0][0],pts[n][1]-pts[0][1])*(.12+rnd(seed+b)*.15);
    h+=strokeArc(pd(zig(p[0],p[1],p[0]+Math.cos(a)*LL,p[1]+Math.sin(a)*LL,seed+b*31,.3,5)),(o.w||10)*.45,(o.op??1)*.85,o.glow);}
