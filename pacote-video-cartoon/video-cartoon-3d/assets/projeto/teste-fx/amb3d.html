<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style>
<script type="importmap">{"imports":{"three":"../lib/three.module.js"}}</script></head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';import { AMB3D } from '../kit/ambiente3d.js';

const A=AMB3D(THREE),up=[];const add=(n,o)=>{try{up.push(A[n](s,o))}catch(e){console.error('ERRO '+n+': '+e.message)}};
add('fireflies',{center:new THREE.Vector3(0,1.5,0),size:new THREE.Vector3(8,3,8)});add('rain',{});add('snow',{n:200});add('dust',{});add('godRay',{pos:new THREE.Vector3(2,5,-3)});
add('fogCards',{});add('candle',{pos:new THREE.Vector3(-1.5,.8,1)});add('lantern',{pos:new THREE.Vector3(1.5,3,1)});add('flag',{pos:new THREE.Vector3(-2.5,3,0)});add('water',{w:5,d:5,pos:new THREE.Vector3(3,.02,-1)});
add('stars',{});add('moon',{});add('clouds',{});add('steam',{pos:new THREE.Vector3(0,1,2)});add('sparksEmitter',{pos:new THREE.Vector3(0,.5,3)});add('birds',{});add('lightning',{});add('neonSign',{pos:new THREE.Vector3(0,3.4,-1)});add('footsteps',{from:new THREE.Vector3(-3,0,2)});add('groundGlow',{pos:new THREE.Vector3(0,.02,1)});
window.NUP=up.length;window.render=t=>{up.forEach(u=>u.update(t,cam));r.render(s,cam)};window.render(2.4);window.ready=true;
</script></body></html>
