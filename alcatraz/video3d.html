function ctex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}

  });
}

  const mat=new THREE.MeshBasicMaterial({map:tex,alphaTest:.5,alphaToCoverage:true,side:THREE.DoubleSide,toneMapped:false});
  const mesh=new THREE.Mesh(geo,mat);mesh.castShadow=true;
  mesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:tex,alphaTest:.5});

  const p=seg(t,g.t0,g.t0+.16),s=.75+.25*back(p),len=g.words.reduce((a,w)=>a+w.w.length+1,0),sz=Math.min(112,940/(len*.47));
  const sp=g.words.map(w=>`<tspan fill="${t>=w.t0?(w.hl?'#ffd23f':'#ffffff'):'#d9d9d9'}">${w.w}</tspan>`).join(' ');
  return `<g transform="translate(540 1560) scale(${s.toFixed(3)})"><text class="cap" y="8" font-size="${f(sz)}" fill="#000" stroke="#000" stroke-width="18" opacity=".4" text-anchor="middle">${g.words.map(w=>w.w).join(' ')}</text><text class="cap" font-size="${f(sz)}" stroke="#111" stroke-width="18" text-anchor="middle">${sp}</text></g>`;
}
let CUR=-1;
window.render=async function(t){
  let i=SCN.findIndex(s=>t>=s.s&&t<s.s+s.d);if(i<0)i=SCN.length-1;
  const u=t-SCN[i].s,d=SCN[i].d;
  if(i!==CUR){CUR=i;hideAll();RAFT.visible=false;mood(SC[i].mood);cam.fov=SC[i].fov||55;cam.updateProjectionMatrix();}
  hideAll();
  const ui=await SC[i].up(u,d);
  SPR.forEach(s=>{if(s.mesh.visible)bill(s);});
  renderer.render(scene,cam);
  document.getElementById('ui').innerHTML=ui;
  document.getElementById('caps').innerHTML=caption(t);
  document.getElementById('flash').setAttribute('opacity',i>0?f(.55*(1-seg(u,0,.25))):'0');
  const fr=Math.floor(t*30),gr=document.getElementById('grain');gr.setAttribute('x',f(-60+rnd(fr)*60));gr.setAttribute('y',f(-60+rnd(fr+5)*60));
};
window.DBG={cam,scene,renderer,SPR,THREE};
window.INFO=setup(window.TIMING);
await window.render(0);
window.ready=true;
</script>
